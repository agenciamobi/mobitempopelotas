name: Temporary lockfile sync artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validar npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Publicar package-lock sincronizado
        uses: actions/upload-artifact@v4
        with:
          name: synced-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
