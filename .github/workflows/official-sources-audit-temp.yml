name: Official sources audit temp

on:
  push:
    branches:
      - agent/runtime-official-sources-audit-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar fontes oficiais e snapshot público
        run: |
          node <<'NODE'
          const headers = {
            'User-Agent': 'TEMPO-Pelotas-Audit/1.1 (+https://tempopelotas.com.br)',
            'Accept-Language': 'pt-BR,pt;q=0.9',
          };

          async function request(url, accept = 'application/json') {
            const response = await fetch(url, {
              headers: { ...headers, Accept: accept },
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
            });
            const text = await response.text();
            return { response, text };
          }

          const endpoints = [
            ['inmetForecast', 'https://apiprevmet3.inmet.gov.br/previsao/4314407', 'application/json'],
            ['inmetAlerts', 'https://apiprevmet3.inmet.gov.br/avisos/getByGeocode/4314407', 'application/json'],
            ['inmetStation', 'https://apiprevmet3.inmet.gov.br/estacao/proxima/4314407', 'application/json'],
            ['embrapa', 'https://agromet.cpact.embrapa.br/online/Current_Monitor.htm', 'text/html'],
          ];

          const results = {};
          for (const [name, url, accept] of endpoints) {
            try {
              const { response, text } = await request(url, accept);
              results[name] = {
                status: response.status,
                ok: response.ok,
                finalUrl: response.url,
                contentType: response.headers.get('content-type'),
                bytes: Buffer.byteLength(text),
              };
              if (!response.ok || text.length < 20) {
                throw new Error(`${name} inválido: HTTP ${response.status}, bytes=${text.length}`);
              }
              if (accept === 'application/json') JSON.parse(text);
            } catch (error) {
              results[name] = { ...(results[name] || {}), error: error instanceof Error ? error.message : String(error) };
            }
          }

          const snapshotResult = await request('https://tempopelotas.com.br/pelotas.json', 'application/json');
          if (!snapshotResult.response.ok) throw new Error(`pelotas.json HTTP ${snapshotResult.response.status}`);
          const snapshot = JSON.parse(snapshotResult.text);
          const current = snapshot?.weather?.current ?? null;
          const currentProvenance = snapshot?.weather?.current_provenance ?? null;
          const sources = snapshot?.weather?.sources ?? {};
          const summaryGeneration = snapshot?.weather?.summary_generation ?? null;

          const homeResult = await request('https://tempopelotas.com.br/', 'text/html');
          if (!homeResult.response.ok) throw new Error(`home HTTP ${homeResult.response.status}`);
          const home = homeResult.text;
          const heroMatch = home.match(/<section[^>]*class="[^"]*weather-hero[^"]*"[\s\S]*?<\/section>/i);
          const heroHtml = heroMatch?.[0] ?? '';
          const heroText = heroHtml
            .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const provenanceValues = currentProvenance && typeof currentProvenance === 'object'
            ? [...new Set(Object.values(currentProvenance).filter(Boolean))]
            : [];

          const audit = {
            checkedAt: new Date().toISOString(),
            endpoints: results,
            publicSnapshot: {
              generatedAt: snapshot?.generated_at ?? null,
              status: snapshot?.status ?? null,
              current,
              currentProvenance,
              currentProvenanceSources: provenanceValues,
              embrapa: sources?.embrapa ?? null,
              inmet: sources?.inmet ?? null,
              forecastSource: snapshot?.weather?.quality?.forecastSource ?? null,
              forecastProvider: snapshot?.weather?.quality?.forecastProvider ?? null,
              summaryGeneration,
            },
            hero: {
              found: Boolean(heroHtml),
              text: heroText.slice(0, 2500),
              hasCurrentStationLabel: /Embrapa Clima Temperado|Leitura das|Atualizada em/.test(heroText),
              hasInmetLabel: /INMET/.test(heroText),
              hasGeminiMarker: /Gemini|gemini/i.test(heroText),
            },
          };

          console.log(JSON.stringify(audit, null, 2));

          if (!results.inmetForecast?.ok) throw new Error('INMET previsão não respondeu ao vivo.');
          if (!results.inmetAlerts?.ok) throw new Error('INMET avisos não respondeu ao vivo.');
          if (!results.inmetStation?.ok) throw new Error('INMET estação não respondeu ao vivo.');
          if (!results.embrapa?.ok) throw new Error('Embrapa não respondeu ao vivo.');
          if (current && (provenanceValues.length !== 1 || provenanceValues[0] !== 'embrapa')) {
            throw new Error(`Proveniência da condição atual não é exclusivamente Embrapa: ${provenanceValues.join(', ') || 'ausente'}.`);
          }
          if (!heroHtml) throw new Error('Hero não foi encontrado no HTML publicado.');
          if (/Gemini|gemini/i.test(heroText)) throw new Error('Hero publicado contém referência a Gemini.');
          NODE
