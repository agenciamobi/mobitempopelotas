name: Official sources audit temp

on:
  push:
    branches:
      - agent/runtime-official-sources-audit-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Auditar sitemap, páginas e interfaces públicas
        run: |
          node <<'NODE'
          const baseUrl = 'https://tempopelotas.com.br';
          const headers = {
            'User-Agent': 'TEMPO-Pelotas-Inventory-Audit/1.0',
            'Accept-Language': 'pt-BR,pt;q=0.9',
          };

          async function fetchText(url, accept = 'text/html') {
            const response = await fetch(url, {
              headers: { ...headers, Accept: accept },
              redirect: 'follow',
              signal: AbortSignal.timeout(20000),
            });
            const text = await response.text();
            return { response, text };
          }

          const sitemap = await fetchText(`${baseUrl}/sitemap.xml`, 'application/xml');
          if (!sitemap.response.ok) throw new Error(`sitemap HTTP ${sitemap.response.status}`);
          const urls = [...sitemap.text.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1]);
          if (urls.length < 35) throw new Error(`Sitemap menor que o esperado: ${urls.length} URLs.`);

          const results = [];
          for (const url of urls) {
            try {
              const { response, text } = await fetchText(url);
              results.push({
                path: new URL(url).pathname,
                status: response.status,
                ok: response.ok,
                bytes: Buffer.byteLength(text),
                contentType: response.headers.get('content-type'),
              });
            } catch (error) {
              results.push({ path: new URL(url).pathname, status: null, ok: false, error: error.message });
            }
          }

          const support = [
            ['/robots.txt', 'text/plain'],
            ['/pelotas.json', 'application/json'],
            ['/feed', 'application/feed+json'],
            ['/embed/nivel-laranjal', 'text/html'],
            ['/embed/status-tempo-agora', 'text/html'],
            ['/widgets/nivel-laranjal.js', 'text/javascript'],
            ['/api/widgets/nivel-laranjal', 'application/json'],
            ['/api/weather/embrapa', 'application/json'],
            ['/api/weather/hourly-precipitation', 'application/json'],
            ['/api/inmet/geadas?days=7&uf=RS', 'application/json'],
          ];
          const supportResults = [];
          for (const [path, accept] of support) {
            try {
              const { response, text } = await fetchText(`${baseUrl}${path}`, accept);
              supportResults.push({ path, status: response.status, ok: response.ok, bytes: Buffer.byteLength(text), contentType: response.headers.get('content-type') });
            } catch (error) {
              supportResults.push({ path, status: null, ok: false, error: error.message });
            }
          }

          const failedPages = results.filter((item) => !item.ok);
          const failedSupport = supportResults.filter((item) => !item.ok);
          console.log(JSON.stringify({
            checkedAt: new Date().toISOString(),
            sitemapCount: urls.length,
            publicPages: results,
            support: supportResults,
            failedPages,
            failedSupport,
          }, null, 2));

          if (failedPages.length > 0) throw new Error(`${failedPages.length} página(s) pública(s) falharam.`);
          if (failedSupport.length > 0) throw new Error(`${failedSupport.length} interface(s) pública(s) falharam.`);
          NODE
