name: Weather AI validation temp

on:
  push:
    branches:
      - agent/limitar-gemini-4x-dia

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install without frozen lock
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Weather AI contracts
        run: node --test tests/weather-ai-snapshots.test.ts
      - name: Production build
        run: npm run build
      - name: TypeScript (global diagnostic)
        continue-on-error: true
        run: npm run typecheck
      - name: ESLint changed runtime files
        run: npx eslint src/lib/weather/weather-ai-snapshot.server.ts src/lib/weather/weather-intelligence.server.ts src/routes/api/cron/push-daily.ts tests/weather-ai-snapshots.test.ts
