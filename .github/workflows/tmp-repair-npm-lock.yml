name: Temporary npm lock repair

on:
  push:
    branches:
      - agent/defesa-civil-hidrometeorologia

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/defesa-civil-hidrometeorologia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore: sync npm lockfile with package manifest"
          git push origin HEAD:agent/defesa-civil-hidrometeorologia
