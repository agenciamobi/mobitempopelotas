name: Atualização temporária da árvore de rotas

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerar árvore de rotas
        shell: bash
        run: |
          node scripts/generate-route-tree.mjs
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Árvore de rotas já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenera árvore de rotas"
          git push origin HEAD:agent/seo-gsc-round-20260816
