name: Weather AI validation

on:
  push:
    branches:
      - agent/limitar-gemini-4x-dia
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: weather-ai-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate weather AI snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without changing lockfile
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate environment template
        run: npm run runtime:check:example

      - name: Validate weather AI contracts
        run: node --test tests/weather-ai-snapshots.test.ts

      - name: Build production bundle
        run: npm run build

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
