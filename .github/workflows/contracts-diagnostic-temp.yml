name: Weather AI budget formatter temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Aplicar Prettier
        run: npx prettier --write src/lib/weather/weather-ai-budget.server.ts src/lib/weather/weather-ai-snapshot.server.ts src/routes/api/cron/push-daily.ts tests/weather-ai-snapshots.test.ts docs/weather-ai-snapshots.md
      - name: Persistir somente formatação
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/weather/weather-ai-budget.server.ts src/lib/weather/weather-ai-snapshot.server.ts src/routes/api/cron/push-daily.ts tests/weather-ai-snapshots.test.ts docs/weather-ai-snapshots.md
          git commit -m "style(ai): formatar guardrail financeiro"
          git push origin HEAD:${{ github.head_ref }}
