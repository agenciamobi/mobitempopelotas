name: Weather AI budget validation temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Validar template de ambiente
        run: npm run runtime:check:example
      - name: Testar snapshots e teto mensal
        run: node --test tests/weather-ai-snapshots.test.ts
      - name: ESLint dos arquivos alterados
        run: npx eslint src/lib/weather/weather-ai-budget.server.ts src/lib/weather/weather-ai-snapshot.server.ts src/routes/api/cron/push-daily.ts tests/weather-ai-snapshots.test.ts
      - name: Prettier dos arquivos alterados
        run: npx prettier --check src/lib/weather/weather-ai-budget.server.ts src/lib/weather/weather-ai-snapshot.server.ts src/routes/api/cron/push-daily.ts tests/weather-ai-snapshots.test.ts docs/weather-ai-snapshots.md
      - name: Build de produção
        run: npm run build
