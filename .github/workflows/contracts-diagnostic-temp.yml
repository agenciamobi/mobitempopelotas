name: Contracts diagnostic temp

on:
  push:
    branches:
      - agent/issue-123-quality-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Capturar contratos
        shell: bash
        run: |
          set +e
          npm run test:contracts > contract-output.txt 2>&1
          status=$?
          echo "$status" > contract-exit-code.txt
          exit 0

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostic
          path: |
            contract-output.txt
            contract-exit-code.txt
          if-no-files-found: error
          retention-days: 1
