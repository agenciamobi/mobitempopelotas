name: SACE validation temp

on:
  push:
    branches:
      - fix/sace-resiliencia-har-20260812

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install without frozen lock
        run: npm install --no-audit --no-fund --package-lock=false
      - name: SACE integration tests
        run: node --test tests/sace-guaiba-integration.test.ts
      - name: Production build
        run: npm run build
      - name: ESLint changed SACE files
        run: npx eslint src/lib/hydrology/sace-guaiba.server.ts src/lib/hydrology/sace-guaiba.functions.ts src/components/hydrology/SaceGuaibaContext.tsx tests/sace-guaiba-integration.test.ts
