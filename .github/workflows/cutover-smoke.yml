# Validação auditável do domínio público para mudanças diretas na main e cutover.
name: Smoke test de cutover

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/cutover-smoke.mjs
      - scripts/seo-production-smoke.mjs
      - .github/workflows/cutover-smoke.yml
      - docs/PRODUCTION_CUTOVER.md
      - public/brand/tempo-pelotas-social.png
      - src/lib/page-meta.ts
      - src/lib/site-config.ts
      - src/lib/structured-data.ts
      - src/lib/public-routes.ts
      - src/routes/**
  pull_request:
    branches:
      - main
    paths:
      - scripts/cutover-smoke.mjs
      - scripts/seo-production-smoke.mjs
      - .github/workflows/cutover-smoke.yml
      - docs/PRODUCTION_CUTOVER.md
      - public/brand/tempo-pelotas-social.png
      - src/lib/page-meta.ts
      - src/lib/site-config.ts
      - src/lib/structured-data.ts
      - src/lib/public-routes.ts
      - src/routes/**

permissions:
  contents: read

jobs:
  validate:
    name: Validar domínio público
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar smoke test
        env:
          BASE_URL: https://tempopelotas.com.br
        run: node scripts/cutover-smoke.mjs

      - name: Validar contratos SEO em produção
        env:
          BASE_URL: https://tempopelotas.com.br
        run: node scripts/seo-production-smoke.mjs

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-smoke-${{ github.run_number }}
          path: artifacts/cutover-smoke
          if-no-files-found: error
          retention-days: 30
