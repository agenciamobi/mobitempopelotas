name: Typecheck diagnostic temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capturar TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          echo $? > typecheck-exit-code.txt
          exit 0
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-current-diagnostic
          path: |
            typecheck.log
            typecheck-exit-code.txt
          retention-days: 1
