name: Weather AI snapshots

on:
  schedule:
    # 23:00, 05:00, 11:00 e 17:00 em America/Sao_Paulo (UTC-3).
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/weather-ai-snapshots.yml
      - src/lib/github-actions-oidc.server.ts
      - src/routes/api/cron/push-daily.ts
      - tests/push-http.test.ts

permissions:
  contents: read
  id-token: write

concurrency:
  group: weather-ai-snapshots
  cancel-in-progress: false

jobs:
  generate:
    name: Generate persisted snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token and call weather AI cron
        env:
          OIDC_AUDIENCE: tempo-pelotas-weather-ai
          CRON_URL: https://tempopelotas.com.br/api/cron/push-daily?task=weather-ai
        run: |
          set -euo pipefail

          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          oidc_response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"

          oidc_token="$(OIDC_RESPONSE="$oidc_response" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["OIDC_RESPONSE"])
          token = payload.get("value", "").strip()
          if not token:
              raise SystemExit("GitHub OIDC não devolveu um token.")
          print(token)
          PY
          )"

          echo "::add-mask::$oidc_token"

          OIDC_TOKEN="$oidc_token" node <<'NODE'
          const { createPublicKey, verify } = require("node:crypto");

          const token = process.env.OIDC_TOKEN;
          const [encodedHeader, encodedPayload, encodedSignature] = token.split(".");
          const header = JSON.parse(Buffer.from(encodedHeader, "base64url").toString("utf8"));
          const claims = JSON.parse(Buffer.from(encodedPayload, "base64url").toString("utf8"));
          const jwks = await fetch("https://token.actions.githubusercontent.com/.well-known/jwks").then((response) => {
            if (!response.ok) throw new Error(`JWKS respondeu HTTP ${response.status}`);
            return response.json();
          });
          const jwk = jwks.keys.find((candidate) => candidate.kid === header.kid);
          if (!jwk) throw new Error(`Chave OIDC não encontrada para kid ${header.kid}`);
          const signatureValid = verify(
            "RSA-SHA256",
            Buffer.from(`${encodedHeader}.${encodedPayload}`),
            createPublicKey({ key: jwk, format: "jwk" }),
            Buffer.from(encodedSignature, "base64url"),
          );
          const safeClaims = {
            iss: claims.iss,
            aud: claims.aud,
            sub: claims.sub,
            repository: claims.repository,
            repository_id: claims.repository_id,
            repository_owner: claims.repository_owner,
            repository_owner_id: claims.repository_owner_id,
            ref: claims.ref,
            workflow_ref: claims.workflow_ref,
            event_name: claims.event_name,
            runner_environment: claims.runner_environment,
          };
          console.log("OIDC diagnóstico seguro:");
          console.log(JSON.stringify({ alg: header.alg, kid: header.kid, signatureValid, claims: safeClaims }, null, 2));
          NODE

          # Em pushes na main, o workflow pode iniciar alguns segundos antes do deploy.
          # A versão anterior deste endpoint responde 503 porque dependia de CRON_SECRET.
          # Repetimos somente esse estado transitório; erros de autenticação e demais HTTPs falham.
          for attempt in $(seq 1 24); do
            response_file="$(mktemp)"
            status="$(curl \
              --silent \
              --show-error \
              --max-time 90 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $oidc_token" \
              --header "Accept: application/json" \
              "$CRON_URL" || true)"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              cat "$response_file"
              rm -f "$response_file"
              exit 0
            fi

            if [[ "$status" == "503" && "$attempt" -lt 24 ]]; then
              echo "Produção ainda serve o contrato anterior (HTTP 503); aguardando deploy — tentativa $attempt/24."
              rm -f "$response_file"
              sleep 10
              continue
            fi

            echo "Weather AI cron respondeu HTTP $status." >&2
            cat "$response_file" >&2 || true
            rm -f "$response_file"
            exit 1
          done

          echo "O deploy não publicou o contrato OIDC dentro da janela de espera." >&2
          exit 1
