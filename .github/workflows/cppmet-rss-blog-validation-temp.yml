name: CPPMet RSS blog validation temp

on:
  push:
    branches:
      - agent/cppmet-rss-blog-validation-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar parser RSS
        run: node --test tests/cppmet-rss-blog.test.ts
      - name: Smoke do RSS real CPPMet/UFPel
        run: |
          node --input-type=module <<'NODE'
          const { parseCppmetRss } = await import('./src/lib/content/cppmet-news.server.ts');
          const candidates = [
            'https://wp.ufpel.edu.br/cppmet/feed/',
            'https://wp.ufpel.edu.br/cppmet/feed',
          ];
          const headers = {
            Accept: 'application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.5',
            'Accept-Language': 'pt-BR,pt;q=0.9',
            'User-Agent': 'TEMPO-Pelotas/2.0 (+https://tempopelotas.com.br)',
          };
          const results = [];
          for (const url of candidates) {
            try {
              const response = await fetch(url, {
                headers,
                redirect: 'follow',
                signal: AbortSignal.timeout(8000),
              });
              const xml = await response.text();
              const items = response.ok ? parseCppmetRss(xml) : [];
              results.push({ url, status: response.status, finalUrl: response.url, items: items.length });
              if (response.ok && items.length > 0) {
                console.log(JSON.stringify({ ok: true, url, status: response.status, finalUrl: response.url, items: items.length, firstTitle: items[0].title }, null, 2));
                process.exit(0);
              }
            } catch (error) {
              results.push({ url, error: error instanceof Error ? error.message : String(error) });
            }
          }
          console.error(JSON.stringify({ ok: false, results }, null, 2));
          process.exit(1);
          NODE
      - name: Validar formatação
        run: npx prettier --check src/lib/content/cppmet-news.server.ts src/lib/content/cppmet-news.functions.ts src/components/blog/CppmetNewsPage.tsx src/components/blog/CppmetNewsPage.css src/routes/blog.tsx src/lib/public-routes.ts src/components/weather/HomeExplorePortal.tsx tests/cppmet-rss-blog.test.ts
      - name: Validar ESLint
        run: npx eslint src/lib/content/cppmet-news.server.ts src/lib/content/cppmet-news.functions.ts src/components/blog/CppmetNewsPage.tsx src/routes/blog.tsx src/lib/public-routes.ts src/components/weather/HomeExplorePortal.tsx tests/cppmet-rss-blog.test.ts
      - name: Gerar árvore oficial de rotas
        run: npm run routes:generate
      - name: Build de produção
        run: npm run build

  compare-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout feature CPPMet
        uses: actions/checkout@v4
        with:
          ref: feat/cppmet-rss-blog-20260814
          path: feature
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências do main
        run: cd base && npm ci --no-audit --no-fund
      - name: Instalar dependências da feature
        run: cd feature && npm ci --no-audit --no-fund
      - name: Comparar falhas dos contratos
        run: |
          set +e
          (cd base && npm run test:contracts) > base-contracts.log 2>&1
          BASE_EXIT=$?
          (cd feature && npm run test:contracts) > feature-contracts.log 2>&1
          FEATURE_EXIT=$?
          set -e

          export BASE_EXIT FEATURE_EXIT
          node <<'NODE'
          const fs = require('node:fs');

          function failureNames(path) {
            const text = fs.readFileSync(path, 'utf8');
            const names = [];
            for (const line of text.split(/\r?\n/)) {
              const tap = line.match(/^\s*not ok \d+ - (.+)$/);
              const spec = line.match(/^\s*[✖✗×]\s+(.+?)(?:\s+\([\d.]+ms\))?\s*$/u);
              const name = tap?.[1] ?? spec?.[1];
              if (name) names.push(name.trim());
            }
            return [...new Set(names)].sort();
          }

          function tail(path) {
            return fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-80).join('\n');
          }

          const baseExit = Number(process.env.BASE_EXIT);
          const featureExit = Number(process.env.FEATURE_EXIT);
          const base = failureNames('base-contracts.log');
          const feature = failureNames('feature-contracts.log');

          if ((baseExit !== 0 && base.length === 0) || (featureExit !== 0 && feature.length === 0)) {
            console.error('Não foi possível extrair as falhas; recusando falso positivo.');
            console.error('--- main tail ---\n' + tail('base-contracts.log'));
            console.error('--- feature tail ---\n' + tail('feature-contracts.log'));
            process.exit(2);
          }

          const added = feature.filter((name) => !base.includes(name));
          const removed = base.filter((name) => !feature.includes(name));

          console.log(JSON.stringify({
            baseExit,
            featureExit,
            baseFailures: base,
            featureFailures: feature,
            addedFailures: added,
            removedFailures: removed,
          }, null, 2));

          if (added.length > 0) process.exit(1);
          NODE
