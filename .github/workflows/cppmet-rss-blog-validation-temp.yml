name: CPPMet RSS blog validation temp

on:
  push:
    branches:
      - agent/cppmet-rss-blog-validation-20260814
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Aplicar Prettier no workspace efêmero
        run: npx prettier --write src/lib/content/cppmet-news.server.ts src/lib/content/cppmet-news.functions.ts src/components/blog/CppmetNewsPage.tsx src/components/blog/CppmetNewsPage.css src/routes/blog.tsx src/lib/public-routes.ts src/components/weather/HomeExplorePortal.tsx tests/cppmet-rss-blog.test.ts
      - name: Testar parser RSS
        run: node --test tests/cppmet-rss-blog.test.ts
      - name: Validar formatação
        run: npx prettier --check src/lib/content/cppmet-news.server.ts src/lib/content/cppmet-news.functions.ts src/components/blog/CppmetNewsPage.tsx src/components/blog/CppmetNewsPage.css src/routes/blog.tsx src/lib/public-routes.ts src/components/weather/HomeExplorePortal.tsx tests/cppmet-rss-blog.test.ts
      - name: Validar ESLint
        run: npx eslint src/lib/content/cppmet-news.server.ts src/lib/content/cppmet-news.functions.ts src/components/blog/CppmetNewsPage.tsx src/routes/blog.tsx src/lib/public-routes.ts src/components/weather/HomeExplorePortal.tsx tests/cppmet-rss-blog.test.ts
      - name: Gerar árvore oficial de rotas
        run: npm run routes:generate
      - name: Build de produção
        run: npm run build
      - name: Persistir arquivos validados no branch técnico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/cppmet-news.server.ts src/components/blog/CppmetNewsPage.tsx src/components/blog/CppmetNewsPage.css src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): aplicar formatação e árvore de rotas validadas"
            git push
          fi
