name: Lockfile sync temp

on:
  push:
    branches:
      - agent/ci-lockfile-sync-20260812

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirmar lockfile reproduzível
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Exigir lockfile sem diferenças
        run: git diff --exit-code -- package-lock.json
      - name: Instalação limpa
        run: npm ci --no-audit --no-fund
      - name: Validar template de ambiente
        run: npm run runtime:check:example
      - name: Contratos rápidos
        run: npm run test:contracts
      - name: Verificar árvore de rotas versionada
        run: npm run routes:check
      - name: Build de produção
        run: npm run build
      - name: Contrato das rotas públicas
        run: npm run test:routes
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
