name: Lockfile sync temp

on:
  push:
    branches:
      - agent/ci-lockfile-sync-20260812

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerar package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persistir lockfile quando necessário
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): sincronizar package-lock com package.json"
            git push origin HEAD:agent/ci-lockfile-sync-20260812
          fi
