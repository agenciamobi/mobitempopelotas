name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Normalizar embeds do Laranjal uma vez
        if: github.event_name == 'push'
        run: |
          npx prettier --write \
            src/components/cameras/LaranjalCamerasEmbedFallback.tsx \
            src/components/cameras/LaranjalCamerasEmbedGrid.tsx
          if git diff --quiet -- \
            src/components/cameras/LaranjalCamerasEmbedFallback.tsx \
            src/components/cameras/LaranjalCamerasEmbedGrid.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/cameras/LaranjalCamerasEmbedFallback.tsx \
            src/components/cameras/LaranjalCamerasEmbedGrid.tsx
          git commit -m "chore: format Laranjal camera embeds"
          git push

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Contratos rápidos
        run: npm run test:contracts

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
