name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Formatar arquivos alterados da integração
        if: github.event_name == 'pull_request'
        run: |
          npx prettier --write \
            src/components/hydrology/DefesaCivilHydroMap.tsx \
            src/components/hydrology/DefesaCivilHydroNetwork.tsx \
            src/lib/hydrology/defesa-civil-rs.server.ts \
            tests/hydrology-overview-page.test.ts \
            tests/redemet-performance.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/hydrology/DefesaCivilHydroMap.tsx \
            src/components/hydrology/DefesaCivilHydroNetwork.tsx \
            src/lib/hydrology/defesa-civil-rs.server.ts \
            tests/hydrology-overview-page.test.ts \
            tests/redemet-performance.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format hydrology integration files"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Contratos rápidos
        run: npm run test:contracts

      - name: Contrato Weather AI
        run: node --test tests/weather-ai-snapshots.test.ts

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint incremental
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lint-changed.mjs
