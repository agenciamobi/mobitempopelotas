name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Contratos rápidos
        shell: bash
        run: |
          set +e
          npm run test:contracts 2>&1 | tee /tmp/contracts.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            failure_block="$(awk 'BEGIN { capture = 0 } /^[[:space:]]*not ok / { capture = 1; block = "" } capture { block = block $0 ORS } END { printf "%s", block }' /tmp/contracts.log | tail -n 60 | base64 -w0)"
            if [ -z "$failure_block" ]; then
              failure_block="$(tail -n 60 /tmp/contracts.log | base64 -w0)"
            fi
            echo "::error title=Contratos rápidos (base64)::$failure_block"
            exit "$status"
          fi

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
