name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Sincronizar formatação e árvore uma única vez
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq "chore: sync generated route tree and formatting"; then
            exit 0
          fi
          npx prettier --write src/components/cameras/CameraPageV2.tsx scripts/generate-route-tree.mjs
          node scripts/generate-route-tree.mjs
          git add src/components/cameras/CameraPageV2.tsx scripts/generate-route-tree.mjs src/routeTree.gen.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync generated route tree and formatting"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Gerar árvore de rotas para estabilização
        run: node scripts/generate-route-tree.mjs

      - name: Exportar árvore de rotas gerada
        uses: actions/upload-artifact@v4
        with:
          name: route-tree-generated
          path: src/routeTree.gen.ts
          retention-days: 1

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Contratos rápidos
        shell: bash
        run: |
          set +e
          npm run test:contracts 2>&1 | tee /tmp/contracts.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            found=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              found=1
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Contrato com falha::$escaped"
            done < <(grep -E '^[[:space:]]*not ok |at TestContext\.<anonymous>.*tests/.*\.test\.ts:[0-9]+:[0-9]+' /tmp/contracts.log | tail -n 80)

            if [ "$found" -eq 0 ]; then
              failure_block="$(tail -n 60 /tmp/contracts.log | base64 -w0)"
              echo "::error title=Contratos rápidos (base64)::$failure_block"
            fi
            exit "$status"
          fi

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
