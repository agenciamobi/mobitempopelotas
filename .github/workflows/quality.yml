name: Qualidade

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, build, rotas, typecheck e lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Diagnosticar contratos rápidos
        shell: bash
        run: |
          failed=0
          while IFS= read -r test_file; do
            [ -z "$test_file" ] && continue
            echo "::group::$test_file"
            if ! node --test "$test_file"; then
              echo "::error file=$test_file::Contrato falhou: $test_file"
              failed=1
            fi
            echo "::endgroup::"
          done < <(node -e 'const p=require("./package.json"); const s=p.scripts["test:contracts"]; console.log([...s.matchAll(/tests\/[A-Za-z0-9._/-]+\.test\.ts/g)].map(m=>m[0]).join("\n"))')
          exit "$failed"

      - name: Verificar árvore de rotas versionada
        run: npm run routes:check

      - name: Build de produção
        run: npm run build

      - name: Contrato das rotas públicas
        run: npm run test:routes

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
