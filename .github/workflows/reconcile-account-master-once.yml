name: Reconcile account master once

on:
  push:
    paths:
      - .github/workflows/reconcile-account-master-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile account status in master document
        shell: python
        run: |
          from pathlib import Path

          path = Path("PROJECT_CURRENT_STATE.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "| Login Google / conta | Parcial | Base funcional, exportação e exclusão implementadas; E2E real ainda pendente |":
                  "| Login Google / conta | Parcial | Google OAuth/PKCE, `account_access`, entitlements centralizados, exportação/exclusão e shell autenticado `/painel` comum a Free/PRO implementados; E2E real com duas contas Google ainda pendente |",
              "- entitlement PRO;":
                  "- entitlement comercial derivado de assinatura/billing; a fundação leve `account_access` + entitlements centralizados já existe;",
              "- guard server-side por recurso premium;":
                  "- guards server-side finais por recurso premium; o contrato central de entitlements já existe;",
              "- dashboard PRO separado da conta;":
                  "- módulos PRO completos dentro do shell autenticado `/painel`; o shell comum Free/PRO já existe;",
              "- usuário autenticado sem assinatura ativa pode acessar `/conta`, checkout e páginas públicas, mas não o painel PRO;":
                  "- usuário autenticado Free pode acessar `/conta` e o shell `/painel`; módulos premium exigem entitlement efetivo validado no servidor;",
              "- `/painel` — visão geral do PRO;":
                  "- `/painel` — shell autenticado comum a Free e PRO, com profundidade liberada por entitlement;",
              "- `/painel` não deve ser habilitado em produção antes de schema, entitlement e E2E estarem confirmados.":
                  "- o shell autenticado `/painel` pode existir para Free; módulos premium não devem ser ativados antes de guards, entitlement e E2E correspondentes estarem confirmados.",
              "### Fase 3 — fundação de banco e entitlement\n\nEntregas no repositório:":
                  "### Fase 3 — fundação de banco e entitlement\n\nEstado: **parcialmente implementada**. A fundação leve `account_access`, o resolvedor central de entitlements e o shell `/painel` já existem. Billing, subscriptions, webhooks e concessão comercial automática permanecem futuros.\n\nEntregas no repositório:",
              "3. validar definitivamente o fluxo `/conta` com duas contas;":
                  "3. validar definitivamente `/conta` → Google OAuth → `/painel` com duas contas reais de teste;",
              "4. auditar fontes para uso comercial/derivado;":
                  "4. após o E2E, implementar favoritos e o primeiro valor real do painel Free;",
              "5. escolher provedor de cobrança e regra de preço;":
                  "5. expor históricos Free e APIs históricas server-side conforme a política de cada dataset;",
              "6. preparar migrations de subscription + entitlement;":
                  "6. continuar auditoria de fontes e aprofundar o Historical Data Layer em paralelo;",
              "7. implementar guards do PRO ainda atrás de flag;":
                  "7. evoluir os guards de recursos PRO sobre o contrato de entitlements já existente;",
              "8. construir o primeiro `/painel` sem IA;":
                  "8. construir módulos PRO somente depois que painel Free e fundação de dados estiverem sólidos;",
              "9. adicionar profundidade de dados;":
                  "9. escolher e integrar billing depois de o produto autenticado demonstrar valor;",
              "A implementação desta nova etapa **ainda não iniciou**. A ordem oficial passa a ser:":
                  "A implementação desta nova etapa **já iniciou**. `account_access`, entitlements centralizados, `/painel`, exportação LGPD com a camada de acesso e reparação segura da fundação da conta já estão implementados. A migration de reparação foi aplicada e validada no Supabase externo. O E2E real do Google OAuth continua sendo o bloqueador antes de favoritos e históricos Free. A ordem oficial permanece:",
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              else:
                  text = text.replace(old, new, 1)

          if missing:
              raise SystemExit("Trechos esperados não encontrados; abortando para não reescrever o mestre: " + repr(missing))

          marker = "## 47. Estado atual da fundação autenticada — 22/08/2026"
          if marker not in text:
              text = text.rstrip() + """


## 47. Estado atual da fundação autenticada — 22/08/2026

Esta seção registra a implementação efetiva posterior à consolidação Público / Free / PRO da seção 46 e prevalece sobre descrições anteriores que tratavam `/painel` como exclusivamente PRO ou a camada de entitlement como inexistente.

Implementado e versionado:

- Google OAuth via Supabase Auth, PKCE e callback server-side com cookies SSR;
- `/conta` para identidade, preferências, privacidade, sessão e indicação Free/PRO;
- `/painel` como shell autenticado comum a Free e PRO, `noindex` e protegido no servidor;
- `public.account_access` com RLS, leitura somente da própria linha pelo autenticado e escrita administrativa reservada;
- todo novo usuário recebe `free` + `active` automaticamente;
- `src/lib/auth/account-access.ts` resolve entitlements centralmente e estados PRO inválidos/expirados falham fechados para Free;
- header autenticado encaminha para `/painel`;
- fluxo `next=/painel` protegido contra open redirect;
- exportação LGPD versão `1.1` inclui a camada `account_access` e continua omitindo tokens, chaves criptográficas e secrets;
- RPC `ensure_current_user_account_foundation()` aplicada ao Supabase externo como reparação defensiva para perfil/preferências/acesso ausentes;
- a RPC usa o próprio `auth.uid()`, é `SECURITY DEFINER` com `search_path` vazio, não aceita execução anônima e, quando precisa criar `account_access`, cria **sempre Free**; nunca promove uma conta para PRO.

Validação de banco concluída:

- triggers de criação de `profiles`, `user_preferences` e `account_access` existem em `auth.users`;
- RLS de `account_access` foi conferida;
- `anon` não executa a RPC de reparação;
- `authenticated` pode executar a reparação somente no contexto da própria identidade obtida por `auth.uid()`.

Bloqueador restante antes de favoritos/históricos Free:

- executar E2E real do Google OAuth em navegador com duas contas descartáveis;
- confirmar criação das três estruturas no primeiro login e camada Free;
- confirmar retorno `/conta?next=/painel` → Google → callback → `/painel`;
- testar preferências/consentimentos, exportação, logout, exclusão/cascata e isolamento entre as duas contas;
- validar o fluxo em mobile.

No momento da última inspeção, `auth.users` ainda estava vazio. Portanto nenhum login Google real foi declarado como validado. Até esse E2E terminar, favoritos e históricos Free não devem ser tratados como fundação concluída.

Documento detalhado: `docs/auth-account.md`.
"""

          path.write_text(text, encoding="utf-8")

      - name: Commit reconciled master
        shell: bash
        run: |
          if git diff --quiet -- PROJECT_CURRENT_STATE.md; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_CURRENT_STATE.md
          git commit -m "docs: reconcile authenticated account status"
          git push origin HEAD:main
