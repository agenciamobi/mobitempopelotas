name: Temporary route tree sync

on:
  push:
    branches:
      - agent/defesa-civil-hidrometeorologia

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/defesa-civil-hidrometeorologia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate route tree
        run: node scripts/generate-route-tree.mjs

      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "routeTree.gen.ts already synchronized"
            exit 0
          fi
          git commit -m "chore: sync generated route tree"
          git push origin HEAD:agent/defesa-civil-hidrometeorologia
