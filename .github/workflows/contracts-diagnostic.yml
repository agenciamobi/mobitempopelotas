name: Diagnóstico temporário de contratos

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gerar e expor diferença da árvore de rotas
        shell: bash
        run: |
          node scripts/generate-route-tree.mjs
          echo '--- ROUTE TREE DIFF START ---'
          git diff --unified=2 -- src/routeTree.gen.ts
          echo '--- ROUTE TREE DIFF END ---'
