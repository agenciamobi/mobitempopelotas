name: Diagnóstico temporário de contratos

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Executor direto
        continue-on-error: true
        run: node scripts/run-contract-tests.mjs

      - name: Executor via npm
        continue-on-error: true
        run: npm run test:contracts

      - name: Grupo 1 isolado após runtime
        continue-on-error: true
        run: node --test tests/water-level-state.test.ts tests/push-http.test.ts tests/database-security.test.ts tests/auth-account-security.test.ts tests/embrapa-centralization.test.ts
