name: Diagnóstico temporário de contratos

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar template de ambiente
        run: npm run runtime:check:example

      - name: Identificar contratos que falham
        shell: bash
        run: |
          status=0
          while read -r test_file; do
            echo "=== ${test_file} ==="
            if ! node --test "${test_file}"; then
              echo "::error file=${test_file}::Contrato falhou isoladamente no CI"
              status=1
            fi
          done < <(grep -o '"tests/[^"]*\.test\.ts"' scripts/run-contract-tests.mjs | tr -d '"')
          exit "${status}"
