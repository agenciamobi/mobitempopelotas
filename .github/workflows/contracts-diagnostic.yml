name: Diagnóstico temporário de contratos

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Comparar contratos do PR com a base
        shell: bash
        run: |
          set +e
          grep -o '"tests/[^"]*\.test\.ts"' scripts/run-contract-tests.mjs | tr -d '"' > /tmp/contracts.txt

          npm ci --no-audit --no-fund
          npm run runtime:check:example

          head_status=0
          while read -r test_file; do
            if ! node --test "${test_file}"; then
              echo "::error file=${test_file}::HEAD falha: ${test_file}"
              head_status=1
            fi
          done < /tmp/contracts.txt

          git checkout --detach 421655bceecdcfb2f49a07d0c5af972366fa2c43
          npm ci --no-audit --no-fund
          npm run runtime:check:example

          base_status=0
          while read -r test_file; do
            if ! node --test "${test_file}"; then
              echo "::warning file=${test_file}::BASE também falha: ${test_file}"
              base_status=1
            fi
          done < /tmp/contracts.txt

          echo "HEAD_STATUS=${head_status} BASE_STATUS=${base_status}"
          exit "${head_status}"
