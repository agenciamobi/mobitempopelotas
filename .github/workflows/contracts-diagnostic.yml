name: Diagnóstico temporário de contratos

on:
  push:
    branches:
      - agent/seo-gsc-round-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Grupo 1
        continue-on-error: true
        run: node --test tests/water-level-state.test.ts tests/push-http.test.ts tests/database-security.test.ts tests/auth-account-security.test.ts tests/embrapa-centralization.test.ts

      - name: Grupo 2
        continue-on-error: true
        run: node --test tests/forecast-accuracy.test.ts tests/open-meteo-edge.test.ts tests/runtime-readiness.test.ts tests/lovable-runtime-readiness.test.ts tests/pwa-scroll-lock.test.ts

      - name: Grupo 3
        continue-on-error: true
        run: node --test tests/document-scroll.test.ts tests/production-css-entry.test.ts tests/weather-traceability.test.ts tests/current-observation.test.ts tests/production-weather-integrity.test.ts

      - name: Grupo 4
        continue-on-error: true
        run: node --test tests/inmet-official-sources.test.ts tests/daily-temperature-reconciliation.test.ts tests/onesignal-integration.test.ts tests/redemet-performance.test.ts tests/internal-editorial-cohesion.test.ts

      - name: Grupo 5
        continue-on-error: true
        run: node --test tests/homepage-coherence.test.ts tests/today-home-visual.test.ts tests/today-typography.test.ts tests/tomorrow-retail-visual.test.ts tests/seven-day-retail-visual.test.ts

      - name: Grupo 6
        continue-on-error: true
        run: node --test tests/rain-retail-visual.test.ts tests/wind-copy.test.ts tests/visitor-language-menu-pages.test.ts tests/radar-satellite-retail.test.ts tests/atmospheric-intelligence.test.ts

      - name: Grupo 7
        continue-on-error: true
        run: node --test tests/meteogram-page.test.ts tests/climate-page.test.ts tests/weather-history-page.test.ts tests/embrapa-station-page.test.ts tests/camera-monitoring-page.test.ts

      - name: Grupo 8
        continue-on-error: true
        run: node --test tests/frost-monitoring-page.test.ts tests/hydrology-overview-page.test.ts tests/internal-weather-widgets.test.ts tests/regional-city-browser-recovery.test.ts tests/regional-city-editorial.test.ts

      - name: Grupo 9
        continue-on-error: true
        run: node --test tests/seo-domain.test.ts tests/seo-content-accessibility.test.ts tests/embed-alerts-hydrology-regional.test.ts tests/sace-guaiba-integration.test.ts tests/route-tree-bootstrap.test.ts
